apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: enterprise-capstone
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "capstone-backend"
        metrics_path: /metrics
        static_configs:
          - targets: ["capstone-backend-service.enterprise-capstone.svc.cluster.local:8000"]
