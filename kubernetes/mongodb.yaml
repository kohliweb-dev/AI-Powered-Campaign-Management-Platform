apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: capstone-mongodb-pvc
  namespace: enterprise-capstone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-mongodb
  namespace: enterprise-capstone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: capstone-mongodb
  template:
    metadata:
      labels:
        app: capstone-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: capstone-mongodb-credentials
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: capstone-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-mongodb-service
  namespace: enterprise-capstone
spec:
  selector:
    app: capstone-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
