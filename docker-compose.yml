services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-capstone-backend
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./campaign_search:/app/campaign_search
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: enterprise-capstone-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped




    # What this file does:
# - backend: runs your FastAPI application inside Docker.
# - frontend: serves your HTML, CSS and JavaScript using Nginx.
# - volumes: preserve your ChromaDB data outside the container.
# - host.docker.internal: allows the backend container to reach
#  your existing PostgreSQL, MongoDB, Redis and Ollama services
#  on Windows.