name: enterprise_capstone

services:
  mongodb:
    image: mongo:7
    container_name: enterprise-capstone-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:l
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise-capstone-backend
    env_file:
      - ../.env
    environment:
      DOCKER_ENV: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      MONGO_URL: "mongodb://mongodb:27017"
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../chroma_db:/app/chroma_db
      - ../campaign_search:/app/campaign_search
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: enterprise-capstone-frontend
    ports:
      - "5500:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:

# What this file does:
# - backend: runs your FastAPI application inside Docker.
# - frontend: serves your HTML, CSS and JavaScript using Nginx.
# - mongodb: provides persistent MongoDB storage for chat history.
# - volumes: preserve your ChromaDB data outside the container.
# - host.docker.internal: allows the backend container to reach
#   your existing PostgreSQL, Redis and Ollama services on Windows.