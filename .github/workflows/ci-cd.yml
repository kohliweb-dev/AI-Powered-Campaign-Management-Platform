
name: Enterprise Capstone CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t enterprise-capstone-backend:latest \
            -f docker/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t enterprise-capstone-frontend:latest \
            -f docker/Dockerfile.frontend .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        if: github.event_name == 'push'
        run: |
          docker tag enterprise-capstone-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-capstone-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-capstone-backend:latest

      - name: Push Frontend Image
        if: github.event_name == 'push'
        run: |
          docker tag enterprise-capstone-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-capstone-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-capstone-frontend:latest
